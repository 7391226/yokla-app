# Örnek nginx sitesi. Kopyala: /etc/nginx/sites-available/yokla
# example.com yerine kendi alan adını yaz. HTTPS için: certbot --nginx -d example.com
#
# Önemli: Yokla istek sınırını X-Real-IP başlığından okur.
# nginx'in arkasında değilsen bu başlığı başka biri uyduramasın diye kendin ayarla.

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
